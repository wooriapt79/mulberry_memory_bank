name: Lynn Daily Memory Update

on:
  workflow_dispatch: # 수동 실행으로 테스트

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install yfinance
        
      - name: Run Risk Logger
        run: python lynn_risk_logger.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add training_logs/*.md
          git commit -m "feat: updated risk response log by Lynn" || echo "No changes"
          git push
