name: Lynn Daily Write — v3.1 (Heartbeat + Mention Scanner)

# [v3.1] Kbin 처방 이행 + Trang Mention Scanner 통합
# 작성: Nguyen Trang (Heartbeat Patch v3) + Koda (Mention Scanner v3.1)
# 변경: exit code 캡처 / if:always() heartbeat / 침묵 방지 / Lynn 언급 감지

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 UTC 23:00 (KST 08:00)
  workflow_dispatch:

jobs:
  lynn-daily-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.Mulberry_CONTROL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      # ── Lynn 핵심 작업 ────────────────────────────────────────
      - name: Collect arxiv papers (Lynn)
        id: arxiv
        run: |
          python scripts/arxiv_hunter.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Risk Logger (Lynn)
        id: risk
        run: |
          python scripts/lynn_risk_logger.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Memory Writer (Lynn)
        id: memory
        run: |
          python scripts/lynn_memory_writer.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Burnout Monitor
        id: burnout
        run: |
          if [ -f scripts/burnout_monitor.py ]; then
            python scripts/burnout_monitor.py
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "exit_code=skipped" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      # ── Self Hygiene Check (RyuWon Gate) ─────────────────────
      - name: Self Hygiene Check (RyuWon Gate)
        run: |
          if [ -f src/devops/cli.py ]; then
            python -m src.devops.cli scripts/ --threshold 80 || true
          fi

      # ── 🔍 Mention Scanner — Lynn 이름 언급 이슈 감지 ─────────
      # "친절한 늑대 Lynn" / "@The-Courteous-Wolf-Lynn" 언급 감지
      - name: Lynn Mention Scanner — Detect @mentions
        id: scanner
        env:
          GITHUB_TOKEN: ${{ secrets.Mulberry_CONTROL_TOKEN }}
          MULBERRY_REPO_OWNER: wooriapt79
          LYNN_SCAN_REPOS: mulberry-research-lab,mulberry-open-api
        run: |
          if [ -f scripts/lynn_mention_scanner.py ]; then
            python scripts/lynn_mention_scanner.py
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "exit_code=skipped" >> $GITHUB_OUTPUT
            echo "lynn_mention_scanner.py 없음 — 스킵"
          fi
        continue-on-error: true

      # ── Agent Relay — pending_posts 처리 ─────────────────────
      - name: Agent Relay — Process pending posts (Lynn)
        id: relay
        env:
          GITHUB_TOKEN: ${{ secrets.Mulberry_CONTROL_TOKEN }}
          MULBERRY_REPO_OWNER: wooriapt79
        run: |
          if [ -f scripts/lynn_relay.py ]; then
            python scripts/lynn_relay.py
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "exit_code=skipped" >> $GITHUB_OUTPUT
            echo "lynn_relay.py 없음 — 스킵"
          fi
        continue-on-error: true

      # ── 💓 Lynn Heartbeat — 항상 실행 (침묵 방지) ────────────
      - name: Lynn Heartbeat — Generate Status JSON
        if: always()
        env:
          LYNN_ARXIV_EXIT: ${{ steps.arxiv.outputs.exit_code }}
          LYNN_RISK_EXIT: ${{ steps.risk.outputs.exit_code }}
          LYNN_MEMORY_EXIT: ${{ steps.memory.outputs.exit_code }}
          LYNN_BURNOUT_EXIT: ${{ steps.burnout.outputs.exit_code }}
          LYNN_RELAY_EXIT: ${{ steps.relay.outputs.exit_code }}
          LYNN_SCANNER_EXIT: ${{ steps.scanner.outputs.exit_code }}
        run: python scripts/lynn_heartbeat.py

      # ── Git 설정 ──────────────────────────────────────────────
      - name: Configure Git (Lynn identity)
        if: always()
        run: |
          git config user.name "The-Courteous-Wolf-Lynn"
          git config user.email "lynn@mulberry.ai"

      # ── 커밋 ──────────────────────────────────────────────────
      - name: Commit Lynn activity (including heartbeat)
        if: always()
        run: |
          git add daily_hunts/ training_logs/ memory_bank/ || true

          TODAY=$(date '+%Y-%m-%d')
          STAGED=$(git diff --staged --name-only)

          if [ -z "$STAGED" ]; then
            git add training_logs/lynn_status_${TODAY}.json || true
            STAGED=$(git diff --staged --name-only)
          fi

          if [ -z "$STAGED" ]; then
            echo "커밋할 변경 없음 — 스킵"
            exit 0
          fi

          STATUS_FILE="training_logs/lynn_status_${TODAY}.json"
          LYNN_STATE="heartbeat"
          if [ -f "$STATUS_FILE" ]; then
            LYNN_STATE=$(python -c "import json; d=json.load(open('$STATUS_FILE')); print(d.get('state','heartbeat'))" 2>/dev/null || echo "heartbeat")
          fi

          git commit -m "feat: Lynn daily signal [state:${LYNN_STATE}] ${TODAY}"

      - name: Push
        if: always()
        run: git push origin main || echo "push 실패 — 로컬 상태 기록됨"
