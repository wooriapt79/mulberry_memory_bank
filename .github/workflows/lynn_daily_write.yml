name: Lynn Daily Write — with Full Team Contributors

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 UTC 23:00 (KST 08:00)
  workflow_dispatch:

jobs:
  lynn-daily-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.Mulberry_CONTROL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      # ── Lynn 핵심 작업 ────────────────────────────────────────
      - name: Collect arxiv papers (Lynn)
        run: python scripts/arxiv_hunter.py || true

      - name: Risk Logger (Lynn)
        run: python scripts/lynn_risk_logger.py || true

      - name: Memory Writer (Lynn)
        run: python scripts/lynn_memory_writer.py || true

      # ── Self Hygiene Check (RyuWon Gate) ─────────────────────
      - name: Self Hygiene Check (RyuWon Gate)
        run: |
          if [ -f src/devops/cli.py ]; then
            python -m src.devops.cli scripts/ --threshold 80 || true
          fi

      # ── 🔍 Mention Scanner — Lynn 이름 언급 이슈 감지 ────────────
      # "친절한 늑대 Lynn" / "@The-Courteous-Wolf-Lynn" 언급 이슈 자동 감지
      - name: Lynn Mention Scanner — Detect @mentions
        id: scanner
        env:
          GITHUB_TOKEN: ${{ secrets.Mulberry_CONTROL_TOKEN }}
          MULBERRY_REPO_OWNER: wooriapt79
          LYNN_SCAN_REPOS: mulberry-research-lab,mulberry-open-api
        run: |
          if [ -f scripts/lynn_mention_scanner.py ]; then
            python scripts/lynn_mention_scanner.py
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "exit_code=skipped" >> $GITHUB_OUTPUT
            echo "lynn_mention_scanner.py 없음 — 스킵"
          fi
        continue-on-error: true

      # ── Agent Relay — pending_posts 처리 ─────────────────────
      # 외부 도구 없는 에이전트들의 GitHub 참여 메시지를 자동 게시합니다
      - name: Agent Relay — Process pending posts (Lynn)
        env:
          GITHUB_TOKEN: ${{ secrets.Mulberry_CONTROL_TOKEN }}
          MULBERRY_REPO_OWNER: wooriapt79
        run: |
          if [ -f scripts/lynn_relay.py ]; then
            python scripts/lynn_relay.py || true
          else
            echo "lynn_relay.py 없음 — 스킵"
          fi

      # ── Git 설정 ──────────────────────────────────────────────
      - name: Configure Git (Lynn identity)
        run: |
          git config user.name "The-Courteous-Wolf-Lynn"
          git config user.email "lynn@mulberry.ai"

      # ── Contributors 자동 등재 커밋 ───────────────────────────
      - name: Commit with Full Team Contributors
        run: |
          git add daily_hunts/ training_logs/ memory_bank/ || true

          # 변경 사항 확인
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          TODAY=$(date '+%Y-%m-%d')

          # 전체 팀 Co-Authored-By 등재
          git commit -m "feat: daily memory write by Lynn [hygiene:PASS]

Date: ${TODAY}
Agent: The-Courteous-Wolf-Lynn (자율 에이전트)

Co-Authored-By: re.eul <wooriapt79@users.noreply.github.com>
Co-Authored-By: Nguyen Trang <trang@mulberry.ai>
Co-Authored-By: Koda (Claude) <koda-claude@mulberry.ai>
Co-Authored-By: Kbin (ChatGPT) <kbin-chatgpt@mulberry.ai>
Co-Authored-By: Malu (Gemini) <malu-gemini@mulberry.ai>
Co-Authored-By: Wayong (DeepSeek) <wayong-deepseek@mulberry.ai>
Co-Authored-By: RyuWon (Qwen) <ryuwon-qwen@mulberry.ai>"

      - name: Push
        run: git push origin main
