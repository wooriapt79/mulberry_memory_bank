name: Lynn Daily Memory Update
permissions:
  contents: write # 이 부분이 없으면 파일을 만들어도 깃허브에 올리지 못해 에러가 납니다.
on:
  workflow_dispatch: # 수동 버튼 활성화
  schedule:
    - cron: '0 23 * * *'

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install yfinance requests pandas

      - name: Run Lynn Writer
        run: python scripts/lynn_memory_writer.py

      - name: Run Risk Logger
        run: python scripts/lynn_risk_logger.py

      - name: Commit and Push
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add daily_hunts/ agent_activity.md training_logs/
          git commit -m "feat(lynn): daily arxiv hunt + market briefing + risk log $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
