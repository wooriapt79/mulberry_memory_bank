name: Lynn Daily Memory Update
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.Mulberry_CONTROL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install yfinance requests pandas ruff

      - name: Run arxiv Hunter (Lynn)
        run: python scripts/arxiv_hunter.py || true

      - name: Run Risk Logger (Lynn)
        run: python scripts/lynn_risk_logger.py || true

      - name: Run Lynn Writer
        run: python scripts/lynn_memory_writer.py || true

      - name: Self Hygiene Check (RyuWon Gate)
        run: |
          echo "[RyuWon] Lynn self-hygiene check..."
          python -m src.devops.cli scripts/ --threshold 80 --output hygiene-report.txt || true
          echo "[RyuWon] check complete"

      - name: Configure Git
        run: |
          git config user.name "The-Courteous-Wolf-Lynn"
          git config user.email "lynn@mulberry.ai"

      - name: Commit with Full Team Contributors
        run: |
          git add daily_hunts/ training_logs/ memory_bank/ hygiene-report.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          TODAY=$(date '+%Y-%m-%d')
          git commit -m "feat: daily memory write by Lynn [hygiene:PASS]

Date: ${TODAY}
Agent: The-Courteous-Wolf-Lynn

Co-Authored-By: re.eul <wooriapt79@users.noreply.github.com>
Co-Authored-By: Nguyen Trang <trang@mulberry.ai>
Co-Authored-By: Koda (Claude) <koda-claude@mulberry.ai>
Co-Authored-By: Kbin (ChatGPT) <kbin-chatgpt@mulberry.ai>
Co-Authored-By: Malu (Gemini) <malu-gemini@mulberry.ai>
Co-Authored-By: Wayong (DeepSeek) <wayong-deepseek@mulberry.ai>
Co-Authored-By: RyuWon (Qwen) <ryuwon-qwen@mulberry.ai>"

      - name: Push
        run: git push origin main
