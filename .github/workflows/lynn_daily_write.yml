name: Lynn Daily Memory Update

on:
  schedule:
    - cron: '0 23 * * *' # 한국시간 오전 8시 자동 실행
  workflow_dispatch:      # 이 줄이 있어야 실장님이 버튼을 눌러 수동 실행 가능합니다!

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install yfinance requests pandas

      - name: Run Lynn Writer
        # 어제 옮긴 scripts/ 폴더 내부 경로를 정확히 지정했습니다.
        run: python scripts/lynn_memory_writer.py

      - name: Commit and Push
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add .
          git commit -m "feat: daily market briefing by Lynn" || echo "No changes to commit"
          git push
