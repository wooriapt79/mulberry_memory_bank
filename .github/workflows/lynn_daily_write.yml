name: Lynn Daily Memory Update

on:
  workflow_dispatch: # 수동 버튼 활성화
  schedule:
    - cron: '0 23 * * *'

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        # 필수 라이브러리를 확실하게 설치합니다.
        run: pip install yfinance requests pandas
        
      - name: Run Lynn Writer
        # scripts 폴더 안의 실행 파일을 호출합니다.
        run: python scripts/lynn_memory_writer.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add .
          git commit -m "feat: daily market briefing by Lynn" || echo "No changes to commit"
          git push
