name: Lynn Daily Memory Update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  write-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Run Structure Expansion (Once)
        run: python lynn_init_skillbank.py
      - name: Commit and Push
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add .
          git commit -m "feat: daily market briefing by Lynn" || echo "No changes to commit"
          git push
