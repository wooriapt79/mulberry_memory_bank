name: Mentor-Junior Test

on:
  workflow_dispatch:    # 수동 실행 버튼 생성

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run mentor-junior test
        run: |
          python Script/run_mentor_junior_test.py

      - name: Upload relationships.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationships
          path: relationships.json
