name: Mulberry Code Hygiene — RyuWon

# 정책:
#   scripts/ (Lynn 파이프라인) → threshold 80, 실패 시 차단
#   그 외 (marrf/, src/, experiments/) → threshold 60, 경고만 (차단 없음)
#   이유: 연구·실험 에이전트는 아이디어 흐름이 먼저다

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lynn 파이프라인 (엄격 게이트) ──────────────────────────
  lynn-hygiene-gate:
    name: Lynn Pipeline Gate (threshold 80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install ruff pytest
      - name: Lynn Scripts Hygiene Check
        run: |
          echo "[RyuWon] Lynn 파이프라인 검수 (기준: 80점)..."
          python -m src.devops.cli scripts/ --threshold 80 --output hygiene-lynn.txt
        env:
          PYTHONPATH: .
      - name: Upload Lynn Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-lynn
          path: hygiene-lynn.txt
          retention-days: 30

  # ── 연구·실험 에이전트 (여유 게이트 — 경고만) ──────────────
  research-hygiene-advisory:
    name: Research Agents Advisory (threshold 60, warn only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install ruff pytest
      - name: Research Code Advisory Check
        run: |
          echo "[RyuWon] 연구 에이전트 검수 (기준: 60점, 차단 없음)..."
          python -m src.devops.cli marrf/ --threshold 60 --output hygiene-research.txt || true
          echo "[RyuWon] 참고용 리포트입니다. 연구의 흐름을 막지 않습니다."
        env:
          PYTHONPATH: .
      - name: Upload Research Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-research-advisory
          path: hygiene-research.txt
          retention-days: 30
