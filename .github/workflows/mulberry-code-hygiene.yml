name: Mulberry Code Hygiene Gate — RyuWon

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  hygiene-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Handoff Readiness Check
        run: |
          echo "[RyuWon] 코드 위생 검수를 시작합니다..."
          python -m src.devops.cli scripts/ --threshold 80 --output hygiene-report.txt
        env:
          PYTHONPATH: .

      - name: Run Tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "tests/ 없음 — 건너뜀"
          fi

      - name: Upload Handoff Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mulberry-handoff-report
          path: hygiene-report.txt
          retention-days: 30
