name: Test Lynn Import

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create __init__.py in script folder
        run: |
          if [ -d "script" ]; then
            touch script/__init__.py
          fi
      - name: Test import
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from script.lynn_core import LynnAgent; a = LynnAgent('Lynn-Test', 'A'); print('✅ Import 성공')"
