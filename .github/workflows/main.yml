name: Lynn Daily Memory Update

on:
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 리포지토리 동기화 오류 방지

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install yfinance pandas requests
        
      - name: Run Lynn Updater
        run: python scripts/lynn_readme_updater.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add README.md
          git commit -m "style: README.md status updated by Lynn" || echo "No changes to commit"
          git push origin main
