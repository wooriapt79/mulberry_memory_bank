name: Lynn Daily Memory Update

on:
  workflow_dispatch: # 실장님의 즉시 지령 대기

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Libs
        run: pip install yfinance
      - name: Run Lynn Updater
        run: python lynn_readme_updater.py
      - name: Commit and Push
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add README.md
          git commit -m "style: README.md status updated by Lynn" || echo "No changes"
          git push
