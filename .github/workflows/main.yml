name: Lynn Daily Memory Update

on:
  workflow_dispatch:

jobs:
  update-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install yfinance pandas requests
        
      - name: Run Lynn Script
        # 경로를 scripts/ 폴더 내부로 지정했습니다.
        run: python scripts/lynn_readme_updater.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "The-Courteous-Wolf-Lynn"
          git config --global user.email "lynn@mulberry.ai"
          git add README.md daily_hunts/*.md training_logs/*.md
          git commit -m "chore: organize scripts and update status by Lynn" || echo "No changes"
          git push
