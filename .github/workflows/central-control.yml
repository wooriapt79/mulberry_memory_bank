name: "Mulberry Central Command"

on:
  issues:
    types: [opened]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: "지시 사항 분석"
        id: parse
        run: |
          # 제목에 [Koda]가 있으면 특정 레포로, [Trang]이 있으면 다른 레포로 보냅니다.
          # 현재는 테스트를 위해 자기 자신에게 신호를 쏘게 설정되어 있습니다.
          echo "target=wooriapt79/mulberry_memory_bank" >> $GITHUB_OUTPUT

      - name: "원격 지시 하달"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.Mulberry_CONTROL_TOKEN }}
          repository: ${{ steps.parse.outputs.target }}
          event-type: "agent_execute"
          # [Malu의 긴급 처방]: toJson()을 사용하여 특수문자 및 줄바꿈 에러를 원천 차단합니다.
          client-payload: >
            {
              "instruction": ${{ toJson(github.event.issue.body) }},
              "issue_number": ${{ toJson(github.event.issue.number) }}
            }
